name: Build & Release Executables

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x86_64 (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary (.exe)
        run: cargo build --release -p drawling-app

      - name: Package Windows Release Archive
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/drawling.exe dist/
          cp README.md dist/
          cd dist
          7z a ../drawling-windows-x86_64.zip drawling.exe README.md
          cd ..

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drawling-windows-x86_64
          path: drawling-windows-x86_64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: cargo build --release -p drawling-app

      - name: Package Linux Release Archive
        run: |
          mkdir -p dist
          cp target/release/drawling dist/
          cp README.md dist/
          tar -czvf drawling-linux-x86_64.tar.gz -C dist drawling README.md

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drawling-linux-x86_64
          path: drawling-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: drawling-windows-x86_64

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: drawling-linux-x86_64

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            drawling-windows-x86_64.zip
            drawling-linux-x86_64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
